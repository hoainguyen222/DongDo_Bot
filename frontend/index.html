<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Trợ lý ảo Chăm sóc khách hàng Đông Đô Partners - Giải đáp thắc mắc về Hàng hóa phái sinh, DDP Invest">
    <title>Đông Đô CS - Trợ lý Chăm sóc Khách hàng</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="chat-container" id="chatContainer">
        <!-- Header -->
        <header class="chat-header" id="chatHeader">
            <div class="header-left">
                <div class="logo-wrapper">
                    <div class="logo-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                            <path d="M12 2L2 7L12 12L22 7L12 2Z" fill="url(#grad1)" opacity="0.9"/>
                            <path d="M2 17L12 22L22 17" stroke="url(#grad2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M2 12L12 17L22 12" stroke="url(#grad2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <defs>
                                <linearGradient id="grad1" x1="2" y1="2" x2="22" y2="12">
                                    <stop offset="0%" stop-color="#60a5fa"/>
                                    <stop offset="100%" stop-color="#a78bfa"/>
                                </linearGradient>
                                <linearGradient id="grad2" x1="2" y1="12" x2="22" y2="22">
                                    <stop offset="0%" stop-color="#60a5fa"/>
                                    <stop offset="100%" stop-color="#a78bfa"/>
                                </linearGradient>
                            </defs>
                        </svg>
                    </div>
                    <div class="header-text">
                        <h1>Đông Đô Partners</h1>
                        <span class="status-badge" id="statusBadge">
                            <span class="status-dot"></span>
                            Trợ lý AI đang hoạt động
                        </span>
                    </div>
                </div>
                <button class="btn-new-chat" id="btnNewChat" title="Cuộc trò chuyện mới">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 5V19M5 12H19"/>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Messages Area -->
        <main class="chat-messages" id="chatMessages">
            <!-- Welcome Message -->
            <div class="welcome-screen" id="welcomeScreen">
                <div class="welcome-icon">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none">
                        <path d="M12 2L2 7L12 12L22 7L12 2Z" fill="url(#wgrad1)" opacity="0.9"/>
                        <path d="M2 17L12 22L22 17" stroke="url(#wgrad2)" stroke-width="1.5" stroke-linecap="round"/>
                        <path d="M2 12L12 17L22 12" stroke="url(#wgrad2)" stroke-width="1.5" stroke-linecap="round"/>
                        <defs>
                            <linearGradient id="wgrad1" x1="2" y1="2" x2="22" y2="12">
                                <stop offset="0%" stop-color="#60a5fa"/>
                                <stop offset="100%" stop-color="#a78bfa"/>
                            </linearGradient>
                            <linearGradient id="wgrad2" x1="2" y1="12" x2="22" y2="22">
                                <stop offset="0%" stop-color="#60a5fa"/>
                                <stop offset="100%" stop-color="#a78bfa"/>
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
                <h2>Xin chào! 👋</h2>
                <p>Tôi là trợ lý ảo Chăm sóc Khách hàng của <strong>Đông Đô Partners</strong>. Tôi có thể giúp bạn giải đáp về:</p>
                <div class="suggestion-chips">
                    <button class="chip" data-message="Hàng hóa phái sinh là gì?">💹 Hàng hóa phái sinh</button>
                    <button class="chip" data-message="Hướng dẫn tôi cách nạp tiền vào tài khoản">💰 Quy trình nạp tiền</button>
                    <button class="chip" data-message="Giới thiệu về nền tảng DDP Invest">📱 Nền tảng DDP Invest</button>
                    <button class="chip" data-message="Cách quản trị rủi ro khi giao dịch?">🛡️ Quản trị rủi ro</button>
                </div>
            </div>
        </main>

        <!-- Input Area -->
        <footer class="chat-input-area" id="chatInputArea">
            <div class="input-wrapper">
                <textarea
                    id="messageInput"
                    placeholder="Nhập câu hỏi của bạn..."
                    rows="1"
                    maxlength="2000"
                ></textarea>
                <button class="btn-send" id="btnSend" disabled title="Gửi tin nhắn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 2L11 13"/>
                        <path d="M22 2L15 22L11 13L2 9L22 2Z"/>
                    </svg>
                </button>
            </div>
            <div class="input-footer">
                <span class="char-count" id="charCount">0 / 2000</span>
            </div>
        </footer>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
