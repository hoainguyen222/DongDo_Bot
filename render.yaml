# ============================================================
# Render.com Blueprint - Đông Đô CS Chatbot
# File này giúp deploy 1-click lên Render
# ============================================================
services:
  - type: web
    name: dongdo-cs-chatbot
    runtime: python
    region: singapore  # Gần Việt Nam nhất
    plan: free
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false  # Nhập thủ công trên Render Dashboard
      - key: PYTHON_VERSION
        value: 3.12.3
    healthCheckPath: /health
    autoDeploy: true
