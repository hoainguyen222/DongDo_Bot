# ============================================================
# Render.com Blueprint - Đông Đô CS Chatbot
# ============================================================

databases:
  - name: dongdo-chat-db
    plan: free
    databaseName: dongdo_chat
    region: singapore

services:
  - type: web
    name: dongdo-cs-chatbot
    runtime: python
    region: singapore
    plan: free
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DATABASE_URL
        fromDatabase:
          name: dongdo-chat-db
          property: connectionString
    autoDeploy: true
